<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* One vertical frame, 540 x 960 CSS pixels, rendered at 2x to 1080 x 1920. */
  :root {
    --paper: #f7f5ef; --card: #fdfcf8; --ink: #17110b; --muted: #8a8378; --rule: #ddd6c8;
    --accent: #2f4d86; --ruling: rgba(70, 105, 160, 0.14); --margin: rgba(170, 70, 60, 0.30);
    --font: "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; }
  body { position: relative; font-family: var(--font); -webkit-font-smoothing: antialiased; }

  .bg { position: absolute; inset: 0; }
  .grain {
    position: absolute; inset: -20px; opacity: 0.10; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.4 -0.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* The window sits in the upper three quarters, clear of TikTok's and
     Instagram's buttons down the right and the caption along the bottom. */
  .win {
    position: absolute; left: 18px; top: 92px; width: 504px; height: 640px;
    background: var(--paper); border-radius: 12px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.18), 0 0 0 0.5px rgba(0, 0, 0, 0.25);
    display: flex; flex-direction: column;
  }
  .bar { height: 38px; flex: none; border-bottom: 1px solid var(--rule); position: relative; }
  .lights { position: absolute; top: 13px; left: 14px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.15); }
  .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .bar svg { position: absolute; top: 11px; color: var(--muted); }
  .bar .panel { left: 80px; } .bar .gear { right: 12px; }

  .page { flex: 1; position: relative; overflow: hidden; }
  .page::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 34px; z-index: 2; background: linear-gradient(var(--paper), rgba(247, 245, 239, 0)); }
  .scroll { position: absolute; left: 0; right: 0; top: 0; padding: 30px 26px 200px 30px; }
  .title { font-weight: 700; font-size: 21px; line-height: 30px; min-height: 30px; margin: 0 0 8px 18px; white-space: pre; }
  .sheet {
    padding-left: 18px; white-space: pre;
    background-image:
      linear-gradient(to right, transparent 9px, var(--margin) 9px, var(--margin) 10px, transparent 10px),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--ruling) calc(var(--lh) - 1px), var(--ruling) var(--lh));
  }
  .sheet div { min-height: var(--lh); line-height: var(--lh); color: var(--ink); }
  .caret { display: inline-block; width: 1.6px; height: 1.1em; background: var(--accent); vertical-align: -0.18em; margin-left: 1px; }
  .caret.off { opacity: 0; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="grain"></div>
<div class="win">
  <div class="bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <svg class="panel" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.5" width="12.5" height="11" rx="0.5"/><path d="M6 2.5v11"/></svg>
    <svg class="gear" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6.7 1.8h2.6l.3 1.85 1.2.7 1.75-.66 1.3 2.26-1.4 1.22v1.4l1.4 1.22-1.3 2.26-1.75-.66-1.2.7-.3 1.85H6.7l-.3-1.85-1.2-.7-1.75.66-1.3-2.26 1.4-1.22v-1.4l-1.4-1.22 1.3-2.26 1.75.66 1.2-.7z"/><circle cx="8" cy="8" r="2.05"/></svg>
  </div>
  <div class="page" id="page">
    <div class="scroll" id="scroll">
      <div class="title" id="title"></div>
      <div class="sheet" id="sheet"></div>
    </div>
  </div>
</div>

<script>
/*
 * Draws the scene at any moment `t` (seconds), from the timeline make.py
 * injects as window.TIMELINE. Nothing here animates by itself: the renderer
 * asks for each frame in turn, so every video is exactly reproducible.
 *
 * TIMELINE = { mood, fontSize, lineHeight, ops: [[t, field, op, ch?], ...] }
 *   field: 't' title or 'b' body; op: '+' type ch, '-' backspace
 */
const MOODS = {
  dusk:   'radial-gradient(120% 70% at 20% 10%, #3b3f73 0%, transparent 60%), radial-gradient(90% 60% at 90% 95%, #d08c79 0%, transparent 60%), linear-gradient(170deg, #171b33 0%, #3a3160 55%, #7a5570 100%)',
  dawn:   'radial-gradient(110% 70% at 80% 5%, #f6d8bd 0%, transparent 60%), radial-gradient(100% 70% at 10% 100%, #8e9cc4 0%, transparent 65%), linear-gradient(175deg, #efcfb9 0%, #c7a4b8 50%, #6f7fa8 100%)',
  forest: 'radial-gradient(110% 70% at 85% 10%, #b8c69a 0%, transparent 55%), radial-gradient(100% 70% at 10% 95%, #1c2d22 0%, transparent 60%), linear-gradient(170deg, #4f6b4b 0%, #2f4634 55%, #172419 100%)',
  sea:    'radial-gradient(110% 70% at 15% 8%, #a9cfd0 0%, transparent 55%), radial-gradient(100% 70% at 90% 100%, #0c2233 0%, transparent 60%), linear-gradient(175deg, #5f97a3 0%, #2d5f73 55%, #10283a 100%)',
  ink:    'radial-gradient(110% 70% at 50% 0%, #3a3530 0%, transparent 60%), linear-gradient(180deg, #221e1a 0%, #0f0d0b 100%)',
}

const T = window.TIMELINE
document.getElementById('bg').style.background = MOODS[T.mood] || MOODS.dusk
const sheet = document.getElementById('sheet'), titleEl = document.getElementById('title')
const scrollEl = document.getElementById('scroll'), page = document.getElementById('page')
sheet.style.setProperty('--lh', T.lineHeight + 'px')
sheet.style.fontSize = T.fontSize + 'px'

const ease = (x) => 1 - Math.pow(1 - x, 3)

// Every moment the caret moved to a new body line, and the scroll it wants
// then, so scrolling can ease between them the same way on every render.
const lineMoves = [{ t: 0, line: 0 }]
{
  let lines = 0
  for (const [t, field, op, ch] of T.ops) {
    if (field !== 'b') continue
    if (op === '+' && ch === '\n') lines++
    if (op === '-' && ch === '\n') lines--
    lineMoves.push({ t, line: lines })
  }
}
const bodyTop = 30 + 30 + 8
function scrollFor(line) {
  const view = page.clientHeight
  const caretBottom = bodyTop + (line + 1) * T.lineHeight
  // Scroll only once the writing nears the bottom of the window.
  return Math.max(0, caretBottom - view * 0.84)
}

function renderAt(t) {
  let title = '', body = '', field = 't', last = -1
  for (const [time, f, op, ch] of T.ops) {
    if (time > t) break
    field = f; last = time
    if (op === '+') f === 't' ? (title += ch) : (body += ch)
    else f === 't' ? (title = title.slice(0, -1)) : (body = body.slice(0, -1))
  }
  // Blink only when idle, like a real caret.
  const idle = last < 0 ? t : t - last
  const on = idle < 0.55 || Math.floor((idle - 0.55) / 0.53) % 2 === 1
  const caret = `<span class="caret${on ? '' : ' off'}"></span>`
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

  titleEl.innerHTML = esc(title) + (field === 't' ? caret : '')
  const lines = body.split('\n')
  sheet.innerHTML = lines.map((line, i) =>
    `<div>${esc(line)}${field === 'b' && i === lines.length - 1 ? caret : ''}</div>`).join('')

  // Ease toward the current line's scroll, from the previous line's.
  let i = lineMoves.length - 1
  while (i > 0 && lineMoves[i].t > t) i--
  const now = lineMoves[i], before = lineMoves.slice(0, i).reverse().find((m) => m.line !== now.line) || now
  let start = i
  while (start > 0 && lineMoves[start - 1].line === now.line) start--
  const from = scrollFor(before.line), to = scrollFor(now.line)
  const k = ease(Math.min(1, (t - lineMoves[start].t) / 0.45))
  let y = from + (to - from) * k
  // Once it's finished, if the whole poem fits, glide back up so the last
  // frame shows all of it, title included.
  const whole = bodyTop + (now.line + 1) * T.lineHeight + 12
  if (whole <= page.clientHeight && t > T.end + 0.7) y *= 1 - ease(Math.min(1, (t - T.end - 0.7) / 0.9))
  scrollEl.style.transform = `translateY(${-y}px)`
}
window.renderAt = renderAt
renderAt(0)
</script>
</body>
</html>
