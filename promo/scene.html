<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* One vertical frame, 540 x 960 CSS pixels, rendered at 2x to 1080 x 1920. */
  :root {
    --paper: #f7f5ef; --card: #fdfcf8; --ink: #17110b; --muted: #8a8378; --rule: #ddd6c8;
    --accent: #2f4d86; --ruling: rgba(70, 105, 160, 0.14); --margin: rgba(170, 70, 60, 0.30);
    --mark: #f6e39b; --select: rgba(47, 77, 134, 0.24);
    --font: "Courier New", Courier, monospace;
    --system: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; }
  body { position: relative; font-family: var(--font); -webkit-font-smoothing: antialiased; }

  .bg { position: absolute; inset: 0; }
  .grain {
    position: absolute; inset: -20px; opacity: 0.10; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.4 -0.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- the menu bar across the top of the screen ---------- */
  .menubar {
    position: absolute; left: 0; right: 0; top: 0; height: 24px; z-index: 5;
    display: flex; align-items: center; gap: 15px; padding: 0 12px;
    font-family: var(--system); font-size: 11.5px; color: #fff;
    background: rgba(20, 20, 30, 0.16); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
  }
  .light .menubar { color: #1d1d1f; background: rgba(255, 255, 255, 0.28); }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .menubar svg { display: block; }

  /* ---------- the Dock ---------- */
  .dock {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5;
    display: flex; align-items: flex-end; gap: 7px; padding: 6px 7px 7px;
    border-radius: 20px; border: 0.5px solid rgba(255, 255, 255, 0.38);
    background: rgba(255, 255, 255, 0.20); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }
  .dock .app { position: relative; width: 44px; height: 44px; }
  .dock .app > * { width: 44px; height: 44px; border-radius: 10px; display: block; }
  .dock .app.running::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 3.5px; height: 3.5px; margin-left: -1.75px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); }
  .light .dock .app.running::after { background: rgba(0, 0, 0, 0.6); }
  .dock .sep { width: 0.5px; align-self: stretch; margin: 4px 1px; background: rgba(255, 255, 255, 0.45); }

  /* ---------- the Seyes window ---------- */
  .win {
    position: absolute; left: 18px; top: 92px; width: 504px; height: 640px;
    background: var(--paper); border-radius: 12px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.18), 0 0 0 0.5px rgba(0, 0, 0, 0.25);
    display: flex; flex-direction: column;
  }
  .bar { height: 38px; flex: none; border-bottom: 1px solid var(--rule); position: relative; }
  .lights { position: absolute; top: 13px; left: 14px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.15); }
  .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .bar svg { position: absolute; top: 11px; color: var(--muted); }
  .bar .panel { left: 80px; } .bar .gear { right: 12px; }

  .page { flex: 1; position: relative; overflow: hidden; }
  .page::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 34px; z-index: 2; background: linear-gradient(var(--paper), rgba(247, 245, 239, 0)); }
  .scroll { position: absolute; left: 0; right: 0; top: 0; padding: 30px 26px 200px 30px; }
  .title { font-weight: 700; font-size: 21px; line-height: 30px; min-height: 30px; margin: 0 0 8px 18px; white-space: pre; }
  .sheet {
    position: relative; padding-left: 18px; white-space: pre;
    background-image:
      linear-gradient(to right, transparent 9px, var(--margin) 9px, var(--margin) 10px, transparent 10px),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--ruling) calc(var(--lh) - 1px), var(--ruling) var(--lh));
  }
  .sheet > div { min-height: var(--lh); line-height: var(--lh); color: var(--ink); }
  .caret { display: inline-block; width: 1.6px; height: 1.1em; background: var(--accent); vertical-align: -0.18em; margin-left: 1px; }
  .caret.off { opacity: 0; }
  .name.bold { font-weight: 700; }
  .name.mark { background: var(--mark); box-shadow: -2px 0 0 var(--mark), 2px 0 0 var(--mark); }
  .sel { background: var(--select); }

  /* Seyes' own formatting bar, as it appears over a selection. */
  /* Drawn a size up from the app, so it reads on a phone. */
  .bubble { position: absolute; z-index: 3; display: flex; background: var(--ink); border-radius: 3px; overflow: hidden; font-size: 15px; box-shadow: 0 8px 18px rgba(0,0,0,0.22); }
  .bubble span { color: var(--paper); padding: 7px 12px; border-left: 1px solid rgba(255,255,255,0.15); }
  .bubble span:first-child { border-left: none; }
  .bubble span.on { background: rgba(255,255,255,0.2); }
  .bubble span.down { background: rgba(255,255,255,0.34); }

  .pointer { position: absolute; z-index: 10; left: 0; top: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="grain"></div>

<div class="menubar">
  <b>Seyes</b><span>File</span><span>Edit</span><span>View</span><span>Window</span>
  <div class="right">
    <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke-opacity=".5"/><rect x="2" y="2" width="12.5" height="7" rx="1.2" fill="currentColor" stroke="none"/><path d="M20.5 3.8v3.4" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".5"/></svg>
    <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 2.2c2.1 0 4 .8 5.5 2.1l1.1-1.2A9.6 9.6 0 0 0 7.5.6 9.6 9.6 0 0 0 .9 3.1L2 4.3a8 8 0 0 1 5.5-2.1zm0 3.1c1.3 0 2.5.5 3.4 1.3l1.1-1.2a6.6 6.6 0 0 0-9 0l1.1 1.2c.9-.8 2.1-1.3 3.4-1.3zm0 3.1c.5 0 1 .2 1.3.5L7.5 10.4 6.2 8.9c.3-.3.8-.5 1.3-.5z"/></svg>
    <span id="clock"></span>
  </div>
</div>

<div class="win">
  <div class="bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <svg class="panel" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.5" width="12.5" height="11" rx="0.5"/><path d="M6 2.5v11"/></svg>
    <svg class="gear" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6.7 1.8h2.6l.3 1.85 1.2.7 1.75-.66 1.3 2.26-1.4 1.22v1.4l1.4 1.22-1.3 2.26-1.75-.66-1.2.7-.3 1.85H6.7l-.3-1.85-1.2-.7-1.75.66-1.3-2.26 1.4-1.22v-1.4l-1.4-1.22 1.3-2.26 1.75.66 1.2-.7z"/><circle cx="8" cy="8" r="2.05"/></svg>
  </div>
  <div class="page" id="page">
    <div class="scroll" id="scroll">
      <div class="title" id="title"></div>
      <div class="sheet" id="sheet"></div>
      <div class="bubble" id="bubble" style="opacity:0"><span>B</span><span>i</span><span>U</span><span>S</span><span>H</span><span>&lt;&gt;</span><span>link</span></div>
    </div>
  </div>
</div>

<!-- Generic app icons in the spirit of a Dock, deliberately not Apple's own. -->
<div class="dock">
  <div class="app running"><svg viewBox="0 0 44 44"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb7ff"/><stop offset="1" stop-color="#2f7be0"/></linearGradient></defs><rect width="44" height="44" rx="10" fill="url(#g1)"/><path d="M10 15h9l2.5 3H34v13H10z" fill="#fff" opacity=".92"/></svg></div>
  <div class="app"><svg viewBox="0 0 44 44"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e6ec"/></linearGradient></defs><rect width="44" height="44" rx="10" fill="url(#g2)"/><circle cx="22" cy="22" r="11" fill="none" stroke="#3a86d6" stroke-width="2.2"/><path d="M11 22h22M22 11c-4 4-4 18 0 22M22 11c4 4 4 18 0 22" fill="none" stroke="#3a86d6" stroke-width="1.6"/></svg></div>
  <div class="app"><svg viewBox="0 0 44 44"><defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#3b8ef0"/></linearGradient></defs><rect width="44" height="44" rx="10" fill="url(#g3)"/><rect x="10" y="14" width="24" height="16" rx="2" fill="#fff"/><path d="M10.5 15l11.5 9 11.5-9" fill="none" stroke="#3b8ef0" stroke-width="1.8"/></svg></div>
  <div class="app"><svg viewBox="0 0 44 44"><rect width="44" height="44" rx="10" fill="#fff"/><path d="M10 0h24a10 10 0 0 1 10 10v3H0v-3A10 10 0 0 1 10 0z" fill="#f0564a"/><text x="22" y="35" text-anchor="middle" font-family="-apple-system, Helvetica" font-size="18" font-weight="300" fill="#1d1d1f" id="dockDay">22</text></svg></div>
  <div class="app"><svg viewBox="0 0 44 44"><defs><linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a8a"/><stop offset="1" stop-color="#f33d5f"/></linearGradient></defs><rect width="44" height="44" rx="10" fill="url(#g5)"/><path d="M18 30V15l12-3v15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="15.5" cy="30" r="3.2" fill="#fff"/><circle cx="27.5" cy="27" r="3.2" fill="#fff"/></svg></div>
  <div class="app running"><img src="__ICON__" alt=""></div>
  <div class="sep"></div>
  <div class="app"><svg viewBox="0 0 44 44"><rect x="4" y="4" width="36" height="36" rx="9" fill="rgba(255,255,255,0.3)"/><path d="M15 16h14l-1.4 16H16.4z" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 16h17M19 13h6" stroke="rgba(255,255,255,0.95)" stroke-width="1.6" stroke-linecap="round"/></svg></div>
</div>

<svg class="pointer" id="pointer" width="25" height="33" viewBox="0 0 18 24" style="opacity:0"><g id="arrow"><path d="M2 1.5v17.2l4.3-4.1 2.8 6.6 2.9-1.2-2.8-6.5h6.1z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></g><g id="beam" style="display:none"><path d="M5 2.5c1.6 0 2.6.4 3.5 1.2.9-.8 1.9-1.2 3.5-1.2M5 21.5c1.6 0 2.6-.4 3.5-1.2.9.8 1.9 1.2 3.5 1.2M8.5 3.7v16.6M6.5 12h4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M5 2.5c1.6 0 2.6.4 3.5 1.2.9-.8 1.9-1.2 3.5-1.2M5 21.5c1.6 0 2.6-.4 3.5-1.2.9.8 1.9 1.2 3.5 1.2M8.5 3.7v16.6M6.5 12h4" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/></g></svg>

<script>
/*
 * Draws the scene at any moment `t` (seconds), from the timeline make.py
 * injects as window.TIMELINE. Nothing here animates by itself: the renderer
 * asks for each frame in turn, so every video is exactly reproducible.
 *
 * TIMELINE = { mood, fontSize, lineHeight, ops, finale, clock, day }
 *   ops: [[t, field, op, ch?], ...]  field 't' title or 'b' body; op '+' type, '-' backspace
 *   finale: when the author's name is selected by hand, made bold, then highlighted
 */
const MOODS = {
  dusk:   'radial-gradient(120% 70% at 20% 10%, #3b3f73 0%, transparent 60%), radial-gradient(90% 60% at 90% 95%, #d08c79 0%, transparent 60%), linear-gradient(170deg, #171b33 0%, #3a3160 55%, #7a5570 100%)',
  dawn:   'radial-gradient(110% 70% at 80% 5%, #f6d8bd 0%, transparent 60%), radial-gradient(100% 70% at 10% 100%, #8e9cc4 0%, transparent 65%), linear-gradient(175deg, #efcfb9 0%, #c7a4b8 50%, #6f7fa8 100%)',
  forest: 'radial-gradient(110% 70% at 85% 10%, #b8c69a 0%, transparent 55%), radial-gradient(100% 70% at 10% 95%, #1c2d22 0%, transparent 60%), linear-gradient(170deg, #4f6b4b 0%, #2f4634 55%, #172419 100%)',
  sea:    'radial-gradient(110% 70% at 15% 8%, #a9cfd0 0%, transparent 55%), radial-gradient(100% 70% at 90% 100%, #0c2233 0%, transparent 60%), linear-gradient(175deg, #5f97a3 0%, #2d5f73 55%, #10283a 100%)',
  ink:    'radial-gradient(110% 70% at 50% 0%, #3a3530 0%, transparent 60%), linear-gradient(180deg, #221e1a 0%, #0f0d0b 100%)',
}
const LIGHT = { dawn: true }  // light wallpapers get a dark menu bar, like macOS

const T = window.TIMELINE, F = T.finale
const $ = (id) => document.getElementById(id)
$('bg').style.background = MOODS[T.mood] || MOODS.dusk
if (LIGHT[T.mood]) document.body.classList.add('light')
$('clock').textContent = T.clock
$('dockDay').textContent = T.day

const sheet = $('sheet'), titleEl = $('title'), scrollEl = $('scroll'), page = $('page')
const bubble = $('bubble'), pointer = $('pointer'), spans = bubble.querySelectorAll('span')
sheet.style.setProperty('--lh', T.lineHeight + 'px')
sheet.style.fontSize = T.fontSize + 'px'

const ease = (x) => 1 - Math.pow(1 - x, 3)
const inOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const clamp = (x) => Math.max(0, Math.min(1, x))
const lerp = (a, b, k) => a + (b - a) * k
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// Every moment the caret moved to a new body line, so scrolling can ease
// between lines the same way on every render.
const lineMoves = [{ t: 0, line: 0 }]
{
  let lines = 0
  for (const [t, field, op, ch] of T.ops) {
    if (field !== 'b') continue
    if (op === '+' && ch === '\n') lines++
    if (op === '-' && ch === '\n') lines--
    lineMoves.push({ t, line: lines })
  }
}
const bodyTop = 30 + 30 + 8
function scrollFor(line) {
  const caretBottom = bodyTop + (line + 1) * T.lineHeight
  // Scroll only once the writing nears the bottom of the window.
  return Math.max(0, caretBottom - page.clientHeight * 0.84)
}

// Where the pointer is at time t, travelling between the name and the bar.
function pointerAt(t, g) {
  const y = g.name.top + g.name.height / 2
  const start = { x: g.name.right + 18, y: y + 16 }
  const atEnd = { x: g.name.right + 1, y }
  const atStart = { x: g.name.left - 1, y }
  const onB = { x: g.b.left + g.b.width / 2, y: g.b.top + g.b.height / 2 }
  const onH = { x: g.h.left + g.h.width / 2, y: g.h.top + g.h.height / 2 }
  const away = { x: onH.x + 50, y: onH.y + 120 }
  const seg = (a, b, t0, t1, fn = inOut) => { const k = fn(clamp((t - t0) / (t1 - t0))); return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) } }
  if (t < F.press) return { ...seg(start, atEnd, F.pointerIn, F.press - 0.1), beam: true }
  if (t < F.release) return { ...seg(atEnd, atStart, F.press, F.release), beam: true }
  if (t < F.boldAt) return { ...seg(atStart, onB, F.boldMove, F.boldAt - 0.12), beam: t < F.boldMove + 0.1 }
  if (t < F.markAt) return { ...seg(onB, onH, F.markMove, F.markAt - 0.12), beam: false }
  return { ...seg(onH, away, F.deselect, F.deselect + 0.6, ease), beam: false }
}

function renderAt(t) {
  let title = '', body = '', field = 't', last = -1
  for (const [time, f, op, ch] of T.ops) {
    if (time > t) break
    field = f; last = time
    if (op === '+') f === 't' ? (title += ch) : (body += ch)
    else f === 't' ? (title = title.slice(0, -1)) : (body = body.slice(0, -1))
  }
  // A real caret blinks only once you stop typing.
  const idle = last < 0 ? t : t - last
  const blink = (since) => since < 0.55 || Math.floor((since - 0.55) / 0.53) % 2 === 1
  const caret = (show) => `<span class="caret${show ? '' : ' off'}"></span>`

  const lines = body.split('\n')
  const finale = t >= F.pointerIn
  const bold = t >= F.boldAt, mark = t >= F.markAt
  const selecting = t >= F.press && t < F.deselect

  titleEl.innerHTML = esc(title) + (field === 't' ? caret(blink(idle)) : '')
  sheet.innerHTML = lines.map((line, i) => {
    const lastLine = i === lines.length - 1
    if (!lastLine || !finale) return `<div>${esc(line)}${field === 'b' && lastLine ? caret(blink(idle)) : ''}</div>`
    // The author's name, during the finale: selected, then bold, then highlighted.
    const cls = `name${bold ? ' bold' : ''}${mark ? ' mark' : ''}`
    const tail = selecting ? '' : caret(t < F.press ? blink(idle) : blink(t - F.deselect))
    return `<div><span class="${cls}" id="name">${esc(line)}</span>${tail}</div>`
  }).join('')

  // Scroll: ease toward the line being written, from the one before it.
  let i = lineMoves.length - 1
  while (i > 0 && lineMoves[i].t > t) i--
  const now = lineMoves[i], before = lineMoves.slice(0, i).reverse().find((m) => m.line !== now.line) || now
  let start = i
  while (start > 0 && lineMoves[start - 1].line === now.line) start--
  const from = scrollFor(before.line), to = scrollFor(now.line)
  let y = from + (to - from) * ease(Math.min(1, (t - lineMoves[start].t) / 0.45))
  // When it's all done, if the whole poem fits, glide up to show all of it.
  const whole = bodyTop + (now.line + 1) * T.lineHeight + 12
  if (whole <= page.clientHeight && t > F.reveal) y *= 1 - ease(Math.min(1, (t - F.reveal) / 0.9))
  scrollEl.style.transform = `translateY(${-y}px)`

  if (!finale) { pointer.style.opacity = 0; bubble.style.opacity = 0; return }

  // Where the name and the formatting bar are, as drawn right now.
  const nameEl = $('name')
  const name = nameEl.getBoundingClientRect(), sr = scrollEl.getBoundingClientRect()
  // Centred over the name, but never past the page's left edge.
  bubble.style.left = `${Math.max(14, name.left - sr.left + name.width / 2 - bubble.offsetWidth / 2)}px`
  bubble.style.top = `${name.top - sr.top - bubble.offsetHeight - 8}px`
  const p = pointerAt(t, { name, b: spans[0].getBoundingClientRect(), h: spans[4].getBoundingClientRect() })

  // The selection follows the pointer back from the end of the name.
  if (selecting) {
    const text = nameEl.textContent, cw = name.width / text.length
    const n = t < F.release ? Math.max(0, Math.min(text.length, Math.round((name.right - p.x) / cw))) : text.length
    const keep = text.length - n
    nameEl.innerHTML = `${esc(text.slice(0, keep))}<span class="sel">${esc(text.slice(keep))}</span>`
  }
  bubble.style.opacity = t < F.deselect ? ease(clamp((t - F.toolbar) / 0.15)) : 1 - clamp((t - F.deselect) / 0.12)
  const pressed = (at) => t >= at - 0.06 && t < at + 0.08
  spans[0].className = pressed(F.boldAt) ? 'down' : bold ? 'on' : ''
  spans[4].className = pressed(F.markAt) ? 'down' : mark ? 'on' : ''

  // An I-beam over text, an arrow over the bar.
  $('arrow').style.display = p.beam ? 'none' : ''
  $('beam').style.display = p.beam ? '' : 'none'
  const [hx, hy] = (p.beam ? [8.5, 12] : [2, 1.5]).map((v) => v * 25 / 18)  // hotspot, at the drawn size
  pointer.style.transform = `translate(${p.x - hx}px, ${p.y - hy}px)`
  pointer.style.opacity = t < F.deselect + 0.25 ? clamp((t - F.pointerIn) / 0.2) : 1 - clamp((t - F.deselect - 0.25) / 0.35)
}
window.renderAt = renderAt
renderAt(0)
</script>
</body>
</html>
